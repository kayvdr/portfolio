services:
  web:
    container_name: portfolio-web
    build: .
    # Only reachable through Caddy, not published on the host.
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    container_name: portfolio-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the Let's Encrypt certificates; losing it forces re-issuance (rate-limited).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
